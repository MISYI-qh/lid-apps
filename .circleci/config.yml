version: 2.1
jobs:
  build:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - checkout
      - run:
          name: Setup (android, web, icons)
          command: bash tool/setup.sh
      - run:
          name: Build APK
          command: flutter build apk --release
      - run:
          name: Build web
          command: flutter build web --release --pwa-strategy=none || flutter build web --release
      - run:
          name: Pack web
          command: tar -czf lid-web.tar.gz -C build/web .
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: lid.apk
      - store_artifacts:
          path: lid-web.tar.gz
          destination: lid-web.tar.gz
workflows:
  build-lid:
    jobs:
      - build
