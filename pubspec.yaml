name: lid
description: lid - produk Misyi
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10+1
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0
  camera: ^0.10.5+9
  video_player: ^2.8.6
  file_picker: ^8.0.0
  record: ^5.1.0
  audioplayers: ^6.0.0
  share_plus: ^10.1.4
  web: ^1.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"
