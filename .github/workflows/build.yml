name: build-lid
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/ci_run.sh bash tool/setup.sh
      - run: bash tool/ci_run.sh flutter build apk --release
      - run: flutter build web --release --pwa-strategy=none || flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: lid-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: lid-web
          path: build/web
