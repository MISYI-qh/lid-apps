name: Build LID Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org id.misyi --project-name lid /tmp/lid-scaffold
            cp -R /tmp/lid-scaffold/android ./android
          fi

      - name: Configure Android SDK and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_kts = Path("android/app/build.gradle.kts")
          gradle = Path("android/app/build.gradle")
          target = gradle_kts if gradle_kts.exists() else gradle
          text = target.read_text()
          if target.suffix == ".kts":
              text = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 24", text)
          else:
              text = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 24", text)
          target.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>',
          ]
          for permission in permissions:
              name = re.search(r'android:name="([^"]+)"', permission).group(1)
              if f'android:name="{name}"' not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lid-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
